build:
  RUN_AWS_TESTS: true
  RUN_AZURE_TESTS: false

azure:
  RUN_AWS_TESTS: true
  RUN_AZURE_TESTS: true
  AZURE_SUBSCRIPTION_ID: !var ci/azure/subscription-id
  AZURE_RESOURCE_GROUP: !var ci/azure/authn-test/resource-group
  USER_ASSIGNED_IDENTITY: !var ci/azure/authn-test/user-assigned-id
  USER_ASSIGNED_IDENTITY_CLIENT_ID: !var ci/azure/authn-test/user-assigned-id-client-id

release:
  WRITE_ARTIFACTORY_USERNAME: !var ci/artifactory/users/jenkins/username
  WRITE_ARTIFACTORY_PASSWORD: !var ci/artifactory/users/jenkins/password
  WRITE_ARTIFACTORY_URL: !var ci/artifactory/url

promote:
  WRITE_ARTIFACTORY_USERNAME: !var ci/artifactory/users/jenkins/username
  WRITE_ARTIFACTORY_PASSWORD: !var ci/artifactory/users/jenkins/password
  WRITE_ARTIFACTORY_URL: !var ci/artifactory/url
  NUGET_API_KEY: !var ci/identity/user/nuget/api-key
