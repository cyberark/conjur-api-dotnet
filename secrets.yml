build:
  RUN_AWS_TESTS: true
  RUN_AZURE_TESTS: false

azure:
  RUN_AZURE_TESTS: "true"
  AZURE_SUBSCRIPTION_ID: !var conjur/azure/subscription_id
  AZURE_RESOURCE_GROUP: !var conjur/azure/resource_group
  AZURE_TENANT_ID: !var conjur/azure/tenant_id
  USER_ASSIGNED_IDENTITY: !var conjur/azure/user_assigned_identity
  USER_ASSIGNED_IDENTITY_CLIENT_ID: !var conjur/azure/user_assigned_identity_client_id

release:
  WRITE_ARTIFACTORY_USERNAME: !var ci/artifactory/users/jenkins/username
  WRITE_ARTIFACTORY_PASSWORD: !var ci/artifactory/users/jenkins/password
  WRITE_ARTIFACTORY_URL: !var ci/artifactory/url

promote:
  WRITE_ARTIFACTORY_USERNAME: !var ci/artifactory/users/jenkins/username
  WRITE_ARTIFACTORY_PASSWORD: !var ci/artifactory/users/jenkins/password
  WRITE_ARTIFACTORY_URL: !var ci/artifactory/url
  NUGET_API_KEY: !var ci/identity/user/nuget/api-key
